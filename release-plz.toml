[workspace]
# cargo-dist's tag-triggered release.yml owns creating the GitHub Release
# (it attaches all the cross-built binaries once every job succeeds) —
# release-plz should only bump the version/changelog and push the tag.
git_release_enable = false
# Not published to crates.io yet — see docs/plans/ if that changes.
publish = false

# NOTE: publish = false routes release-plz through its "git_only" comparison
# mode, whose internal `cargo package` step currently fails against this repo
# (upstream bug — see release-plz/release-plz#2789 and related #2651/#2652/
# #2595 for the same code path failing in other ways). Symptom: release-plz-pr
# always logs "next version is X.Y.Z" (unchanged) and never opens a PR, no
# matter what commits land. Until that's fixed upstream, bump the `version`
# in Cargo.toml by hand before merging/pushing a release — the release job's
# tag creation itself works fine (it just checks "is there already a tag for
# the current Cargo.toml version", which doesn't hit the buggy path).
