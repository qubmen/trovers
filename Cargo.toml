[package]
name = "trovers"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ratatui = "0.30.0"
crossterm = "0.29.0"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0.0"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3"
