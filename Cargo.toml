[package]
name = "trovers"
version = "0.1.1"
edition = "2021"
description = "A keyboard-driven terminal media player/downloader built on mpv + yt-dlp"
license = "Apache-2.0"
repository = "https://github.com/qubmen/trovers"
homepage = "https://github.com/qubmen/trovers"
readme = "README.md"
keywords = ["cli", "tui", "music", "youtube", "mpv"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.4+spec-1.1.0"
ratatui = "0.30.2"
crossterm = "0.29.0"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0.0"
regex = "1"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
